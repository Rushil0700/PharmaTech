# One public entry point for the whole stack:
#   /            React app (single-page app, so unknown paths fall back to index.html)
#   /api/        Django REST API
#   /admin/      Django admin
#   /static/     Django admin assets
#   /grafana/    Grafana dashboards (Grafana runs with serve_from_sub_path)
# Cloudflare Tunnel only needs to point at this container.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Resolve backend/grafana through Docker's DNS at request time (not once at
    # start-up), so recreating those containers doesn't leave nginx on stale IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django  http://backend:8000;
    set $grafana http://grafana:3000;

    # Honour the scheme Cloudflare saw (https) when it is provided.
    set $fwd_proto $scheme;
    if ($http_x_forwarded_proto) { set $fwd_proto $http_x_forwarded_proto; }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;
    }
    location /admin/ {
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location /static/ { proxy_pass $django; expires 7d; }

    # Never expose Django's Prometheus metrics publicly.
    location = /metrics { return 404; }

    location /grafana/ {
        proxy_pass $grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    # Grafana Live (websocket) for real-time panel updates.
    location /grafana/api/live/ {
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    root /usr/share/nginx/html;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }
}
