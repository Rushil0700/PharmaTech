apiVersion: 1

datasources:
  - name: PharmaTrack DB
    uid: pharmatrack-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_reader
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    editable: false

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s
    editable: false
