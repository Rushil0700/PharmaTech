global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Django: HTTP requests, latency, DB queries + custom pharmatrack_* business counters
  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # PostgreSQL: connections, transactions, database size
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Containers: CPU, memory, network per container
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Demo sales simulator (compose profile "demo"); no target when it isn't running
  - job_name: simulator
    dns_sd_configs:
      - names: ["simulator"]
        type: A
        port: 8001

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
